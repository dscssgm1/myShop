server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: myshop-gateway
  config:
    import:
      - optional:nacos:myshop-gateway.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
      config:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
        file-extension: yml
    gateway:
      routes:
        - id: myshop-system
          uri: lb://myshop-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
        - id: myshop-product
          uri: lb://myshop-product
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/specs/**
          filters:
            - StripPrefix=1
        - id: myshop-order
          uri: lb://myshop-order
          predicates:
            - Path=/api/cart/**,/api/orders/**
          filters:
            - StripPrefix=1
        - id: myshop-payment
          uri: lb://myshop-payment
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: myshop-discount
          uri: lb://myshop-discount
          predicates:
            - Path=/api/promotions/**,/api/coupons/**,/api/discounts/**,/api/recommendations/**,/api/push/**
          filters:
            - StripPrefix=1
        - id: myshop-merchant
          uri: lb://myshop-merchant
          predicates:
            - Path=/api/shops/**,/api/merchant/**
          filters:
            - StripPrefix=1
        - id: myshop-logistics
          uri: lb://myshop-logistics
          predicates:
            - Path=/api/logistics/**
          filters:
            - StripPrefix=1
        - id: myshop-message
          uri: lb://myshop-message
          predicates:
            - Path=/api/messages/**
          filters:
            - StripPrefix=1
        - id: myshop-platform
          uri: lb://myshop-platform
          predicates:
            - Path=/api/audit/**,/api/config/**,/api/logs/**,/api/dashboard/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: false

# Token 鉴权：密钥需与 myshop-system 保持一致
myshop:
  security:
    jwt:
      secret: ${MYSHOP_JWT_SECRET:myshop-default-secret-please-change-in-production-2026}
    whitelist:
      - /api/system/auth/
      - /api/products
      - /api/categories
      - /api/brands
      - /api/specs
      - /api/shops
      - /api/promotions
      - /api/recommendations
