server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: myshop-gateway
  config:
    import:
      - optional:nacos:myshop-gateway.yml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
      config:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
        file-extension: yml
    gateway:
      routes:
        - id: myshop-system
          uri: lb://myshop-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
        - id: myshop-product
          uri: lb://myshop-product
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/specs/**
          filters:
            - StripPrefix=1
        - id: myshop-order
          uri: lb://myshop-order
          predicates:
            - Path=/api/cart/**,/api/orders/**
          filters:
            - StripPrefix=1
        - id: myshop-payment
          uri: lb://myshop-payment
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: myshop-discount
          uri: lb://myshop-discount
          predicates:
            - Path=/api/promotions/**,/api/coupons/**,/api/discounts/**,/api/recommendations/**,/api/push/**
          filters:
            - StripPrefix=1
        - id: myshop-merchant
          uri: lb://myshop-merchant
          predicates:
            - Path=/api/shops/**,/api/merchant/**
          filters:
            - StripPrefix=1
        - id: myshop-logistics
          uri: lb://myshop-logistics
          predicates:
            - Path=/api/logistics/**
          filters:
            - StripPrefix=1
        - id: myshop-message
          uri: lb://myshop-message
          predicates:
            - Path=/api/messages/**
          filters:
            - StripPrefix=1
        - id: myshop-platform
          uri: lb://myshop-platform
          predicates:
            - Path=/api/audit/**,/api/config/**,/api/logs/**,/api/dashboard/**,/api/platform/**
          filters:
            - StripPrefix=1
        - id: myshop-review
          uri: lb://myshop-review
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=1
        - id: myshop-file
          uri: lb://myshop-file
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: false

  # 网关转发大文件上传时避免 DataBufferLimitException
  codec:
    max-in-memory-size: 20MB

# Token 鉴权：密钥需与 myshop-system 保持一致
myshop:
  security:
    jwt:
      secret: ${MYSHOP_JWT_SECRET:myshop-default-secret-please-change-in-production-2026}
    whitelist:
      # 仅登录/注册/找回密码允许匿名；/auth/logout、/auth/sessions、/auth/me 需要有效会话
      - /api/system/auth/login
      - /api/system/auth/register
      - /api/system/auth/email-code
      - /api/system/auth/password/forgot
      - /api/system/auth/password/reset
      - /api/products
      - /api/categories
      - /api/brands
      - /api/specs
      - /api/shops
      - /api/promotions
      # 商品卡最低到手价：匿名可看活动价，登录用户自动叠加可用券
      - /api/discounts/product-prices
      - /api/recommendations
      - /api/reviews
      # 积分商城商品浏览（兑换需登录）
      - /api/system/points-mall/items
      # 买家端公开运营配置（Banner、支付方式、系统参数等）
      - /api/config/public/
