server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: myshop-logistics
  config:
    import:
      - optional:nacos:myshop-logistics.yml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
      config:
        group: config
        namespace: ${NACOS_NAMESPACE:myShop}
        file-extension: yml
