# myshop-file 服务配置（dataId: myshop-file.yml，group: config，namespace: myShop）
# 文件服务无数据库；MinIO 连接信息在此集中管理，环境变量可覆盖
myshop:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-url: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:myshop}

logging:
  level:
    com.four_person: info
