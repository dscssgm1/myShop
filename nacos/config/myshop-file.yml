# myshop-file 服务配置（dataId: myshop-file.yml，group: config，namespace: myShop）
# 文件服务无数据库；MinIO 连接信息在此集中管理，环境变量可覆盖
myshop:
  minio:
    # 线上对象存储：图片地址会直接存入数据库，必须是外部电脑可达的公网地址
    endpoint: ${MINIO_ENDPOINT:http://101.132.73.8:9000}
    public-url: ${MINIO_PUBLIC_URL:http://101.132.73.8:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:myshop}

logging:
  level:
    com.four_person: info
