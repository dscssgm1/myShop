# myshop-system 服务配置（Nacos 配置中心，dataId: myshop-system.yml，group: DEFAULT_GROUP）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:myshop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      initialization-fail-timeout: -1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

# 认证配置
myshop:
  security:
    jwt:
      # 生产环境务必覆盖，长度不少于 32 字节
      secret: ${MYSHOP_JWT_SECRET:myshop-default-secret-please-change-in-production-2026}
      expiration-seconds: ${MYSHOP_JWT_EXPIRATION:7200}
      issuer: myshop
    email-code:
      debug: ${MYSHOP_EMAIL_CODE_DEBUG:true}

logging:
  level:
    com.four_person: debug
